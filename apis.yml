name: HungryHub
description: >-
  HungryHub is a restaurant reservation and dining-deals platform operating
  primarily in Bangkok, Thailand. It connects diners with fixed-price dining
  packages — all-you-can-eat buffets, omakase, fine dining, rooftop venues,
  hotel staycations and cruise dining — from luxury hotels and restaurants,
  often at significant savings. The consumer marketplace runs on the web and
  in mobile apps, while a separate business portal gives 2,000+ partner
  restaurants and hotel chains a booking and package-management dashboard. The
  company reports serving more than four million customers monthly and is a
  portfolio company of 500 Global. HungryHub publishes no public developer or
  partner API; this profile captures its public web, discovery and security
  surface.
